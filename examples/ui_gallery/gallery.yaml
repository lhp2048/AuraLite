theme: light
Absolute:
  width: fill
  height: fill
  children:
    - Column:
        width: fill
        height: fill
        padding: 12
        spacing: 8
        children:
          - Label: { text: "AuraLite UI Gallery", font_size: 22 }
          - Row:
              spacing: 8
              v_align: center
              children:
                - Button: { text: "Light", width: hug, height: 32 }
                - Button: { text: "Dark", width: hug, height: 32 }
                - Switch: { text: "动画", value: true, tooltip: "开关控件过渡：Toast / Switch / Slider / Tab / 滚动 / Tooltip" }
          - Label:
              name: status
              text: "就绪 · 从资源管理器拖文件到窗口"
              font_size: 13
              preferred_height: 22
          - Tab:
              name: gallery_nav
              selected: 0
              headers: ["控件", "布局", "列表", "窗口", "拖放"]
              header_height: 36
              width: fill
              height: fill
              children:
                - ScrollView:
                    width: fill
                    height: fill
                    content:
                      Column:
                        padding: 16
                        spacing: 10
                        children:
                          - Row:
                              spacing: 16
                              children:
                                - Checkbox: { text: "记住选项", checked: false }
                                - Switch: { text: "通知", value: false }
                          - Row:
                              spacing: 16
                              children:
                                - Radio: { text: "选项 A", group_id: 1, checked: true }
                                - Radio: { text: "选项 B", group_id: 1, checked: false }
                          - Label: { text: "TextField", font_size: 13, preferred_height: 18 }
                          - TextField: { placeholder: "输入文字（支持 IME）", width: fill, height: 36 }
                          - Label: { text: "Password", font_size: 13, preferred_height: 18 }
                          - TextField: { placeholder: "密码（不复制明文）", password: true, width: fill, height: 36 }
                          - Label: { text: "TextField 回车提交", font_size: 13, preferred_height: 18 }
                          - TextField: { placeholder: "回车提交", width: fill, height: 36 }
                          - Button: { text: "Button", width: fill, height: 40, on_click: gallery_click }
                          - Row:
                              spacing: 8
                              children:
                                - Button: { text: "Primary", width: fill, height: 36 }
                                - Button: { text: "Secondary", variant: secondary, width: fill, height: 36 }
                                - Button: { text: "Danger", variant: danger, width: fill, height: 36 }
                          - Row:
                              spacing: 8
                              children:
                                - Button: { text: "禁用", enabled: false, width: hug, height: 36 }
                                - Button: { name: icon_btn, text: "图标", width: hug, height: 36, tooltip: "Button::icon_bgra" }
                          - Row:
                              spacing: 12
                              children:
                                - ImageView: { width: 72, height: 72 }
                                - ImageButton: { name: img_on, width: 56, height: 56, on_click: image_btn_click }
                                - ImageButton: { name: img_off, width: 56, height: 56, enabled: false }
                          - Label: { text: "ProgressBar / Slider", font_size: 13, preferred_height: 18 }
                          - ProgressBar: { value: 0.45, height: 12 }
                          - Slider: { value: 0.45, height: 36, step: 0.05, tick_count: 5 }
                          - Label: { text: "ProgressBar indeterminate", font_size: 13, preferred_height: 18 }
                          - ProgressBar: { indeterminate: true, height: 12 }
                          - Label: { text: "Vertical Slider", font_size: 13, preferred_height: 18 }
                          - Row:
                              spacing: 12
                              height: 100
                              children:
                                - Slider: { value: 0.6, orientation: vertical, width: 28, height: fill }
                                - Label: { text: "↑ 键盘 / 拖动", font_size: 12, preferred_height: 20, width: hug }
                          - Label: { text: "Combo", font_size: 13, preferred_height: 18 }
                          - Combo:
                              selected: 0
                              items: ["选项一", "选项二", "选项三", "选项四", "选项五"]
                          - Label: { text: "Combo（可筛选）", font_size: 13, preferred_height: 18 }
                          - Combo:
                              editable: true
                              selected: 0
                              items: ["北京", "上海", "广州", "深圳", "杭州", "成都"]
                          - Label: { text: "Combo（多选）", font_size: 13, preferred_height: 18 }
                          - Combo:
                              multi: true
                              selected: [0, 2]
                              items: ["红", "橙", "黄", "绿", "蓝"]
                          - Label: { text: "TextArea（软换行）", font_size: 13, preferred_height: 18 }
                          - TextArea:
                              placeholder: "多行输入（软换行 / Enter 硬换行）"
                              height: 100
                              wrap: true
                              text: "这是一段较长的文本，用来演示按控件宽度自动软换行；也可以按 Enter 插入硬换行。\n第二段。"
                          - Label: { text: "TextArea（不换行）", font_size: 13, preferred_height: 18 }
                          - TextArea:
                              placeholder: "关闭软换行"
                              height: 72
                              wrap: false
                              text: "关闭软换行后这一行会保持很长：ABCDEFGHIJKLMNOPQRSTUVWXYZ-0123456789"
                          - Label: { text: "Label wrap / trim", font_size: 13, preferred_height: 18 }
                          - Label:
                              wrap: true
                              font_size: 14
                              text: "这段 Label 会按列宽自动折行（只读）。单行过长可用 trim: end / middle / start。"
                          - Row:
                              spacing: 8
                              children:
                                - Label: { text: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", trim: end, width: 120, height: 22 }
                                - Label: { text: "C:\\very\\long\\path\\file.txt", trim: middle, width: 160, height: 22 }
                          - Label: { text: "Tab / Shift+Tab 走焦", font_size: 13, preferred_height: 18 }
                          - Row:
                              spacing: 8
                              children:
                                - Button: { text: "焦1", width: hug, height: 32 }
                                - Button: { text: "焦2", width: hug, height: 32 }
                                - Button: { text: "焦3", width: hug, height: 32 }
                          - Label: { text: "UserControl（自绘）", font_size: 13, preferred_height: 18 }
                          - UserControl: { name: demo_canvas, width: fill, height: 80 }
                          - Label: { text: "NativeHost（HWND 黑盒 · Owned EDIT）", font_size: 13, preferred_height: 18 }
                          - NativeHost: { name: native_demo, width: fill, height: 80 }
                - Absolute:
                    width: fill
                    height: fill
                    children:
                      - ScrollView:
                          width: fill
                          height: fill
                          content:
                            Column:
                              padding: 16
                              spacing: 10
                              children:
                                - Label: { text: "拖拽分割 · SplitView", font_size: 13, preferred_height: 22 }
                                - SplitView:
                                    width: fill
                                    height: 100
                                    ratio: 0.42
                                    leading:
                                      Label: { text: "SplitView 左", font_size: 14, align: center }
                                    trailing:
                                      Label: { text: "SplitView 右", font_size: 14, align: center }
                                - Label: { text: "weight + h_align / v_align（仅 fill 吃 weight）", font_size: 13, preferred_height: 18 }
                                - Row:
                                    spacing: 8
                                    v_align: center
                                    height: 48
                                    children:
                                      - Button: { text: "w1", width: fill, height: 32, weight: 1 }
                                      - Button: { text: "w2", width: fill, height: 40, weight: 2 }
                                      - Button: { text: "hug", width: hug, height: 28 }
                                - Column:
                                    spacing: 6
                                    h_align: end
                                    height: 100
                                    children:
                                      - Button: { text: "上 weight1", height: fill, weight: 1, width: 120 }
                                      - Button: { text: "下 weight2", height: fill, weight: 2, width: 160 }
                                - Label: { text: "h_align center（Row 无 fill 子项时水平打包）", font_size: 13, preferred_height: 18 }
                                - Row:
                                    spacing: 8
                                    h_align: center
                                    height: 40
                                    children:
                                      - Button: { text: "A", width: hug, height: 28 }
                                      - Button: { text: "B", width: hug, height: 28 }
                                - Label: { text: "Tile（固定 3 列）", font_size: 13, preferred_height: 18 }
                                - Tile:
                                    columns: 3
                                    item_height: 36
                                    spacing: 8
                                    children:
                                      - Button: { text: "T1", height: 36 }
                                      - Button: { text: "T2", height: 36 }
                                      - Button: { text: "T3", height: 36 }
                                      - Button: { text: "T4", height: 36 }
                                      - Button: { text: "T5", height: 36 }
                                      - Button: { text: "T6", height: 36 }
                                - Label: { text: "Tile（columns=0 按宽度折列）", font_size: 13, preferred_height: 18 }
                                - Tile:
                                    columns: 0
                                    item_width: 80
                                    item_height: 36
                                    spacing: 8
                                    children:
                                      - Button: { text: "G1", height: 36 }
                                      - Button: { text: "G2", height: 36 }
                                      - Button: { text: "G3", height: 36 }
                                      - Button: { text: "G4", height: 36 }
                                      - Button: { text: "G5", height: 36 }
                                - Label: { text: "Tab（子页里的 Absolute 叠层）", font_size: 13, preferred_height: 18 }
                                - Tab:
                                    selected: 0
                                    headers: ["页面 A", "页面 B"]
                                    header_height: 36
                                    width: fill
                                    height: 160
                                    children:
                                      - Label: { text: "页面 A：没有浮动层", font_size: 14, align: center }
                                      - Absolute:
                                          width: fill
                                          height: fill
                                          children:
                                            - Label: { text: "页面 B：右下角浮动，切回 A 即隐藏", font_size: 14, align: center }
                                            - Button: { text: "页内浮动", right: 8, bottom: 8, width: hug, height: 32, tooltip: "属于这一页，切走即隐藏" }
                                - Label: { text: "Absolute（锚定优先 / x·y 兜底）", font_size: 13, preferred_height: 18 }
                                - Absolute:
                                    width: fill
                                    height: 120
                                    children:
                                      - Button: { text: "left+right", left: 8, right: 8, top: 8, height: 32 }
                                      - Label: { text: "x=12 y=48", font_size: 13, x: 12, y: 48, width: hug, height: hug }
                                      - Button: { text: "RB", right: 8, bottom: 8, width: 72, height: 28 }
                                - Label: { text: "set_visible", font_size: 13, preferred_height: 18 }
                                - Row:
                                    spacing: 8
                                    v_align: center
                                    children:
                                      - Button: { text: "切换显隐", width: hug, height: 32 }
                                      - Label: { name: hide_me, text: "这段可以藏起来", font_size: 13, preferred_height: 22 }
                      - Button: { text: "浮动", right: 16, bottom: 16, width: hug, height: 40, tooltip: "仅「布局」页右下角，切走即隐藏" }
                - ScrollView:
                    width: fill
                    height: fill
                    content:
                      Column:
                        padding: 16
                        spacing: 10
                        children:
                          - Label: { text: "VirtualList（多列表头）", font_size: 13, preferred_height: 18 }
                          - VirtualList:
                              count: 50000
                              height: 180
                              show_header: true
                              frozen_count: 1
                              columns:
                                - { title: "名称", width: 140 }
                                - { title: "状态", width: 160 }
                                - { title: "详情", width: 180 }
                                - { title: "编号", width: 100, align: right }
                          - Label: { text: "TreeView（勾选 + 懒加载）", font_size: 13, preferred_height: 18 }
                          - TreeView:
                              height: 180
                              checkable: true
                              nodes:
                                - text: "智能家庭"
                                  expanded: true
                                  checked: true
                                  children:
                                    - text: "房间"
                                      expanded: true
                                      children: ["客厅", "主卧", "次卧"]
                                    - text: "设备"
                                      expanded: true
                                      children:
                                        - text: "灯光"
                                          children: ["吊灯", "筒灯"]
                                        - "空调"
                                        - "窗帘"
                                    - text: "情景"
                                      children: ["回家", "离家"]
                                    - text: "云端设备"
                                      lazy: true
                          - Label: { text: "ItemList（模板 + 表头）", font_size: 13, preferred_height: 18 }
                          - ItemList:
                              count: 100
                              row_height: 40
                              height: 180
                              show_header: true
                              header_height: 28
                              frozen_count: 1
                              columns:
                                - { title: "任务", width: 140 }
                                - { title: "进度", width: 280 }
                                - { title: "操作", width: 64, sortable: false }
                              item_template:
                                Row:
                                  spacing: 8
                                  width: fill
                                  height: fill
                                  v_align: center
                                  children:
                                    - Label: { name: title, width: 140, font_size: 13 }
                                    - ProgressBar: { name: progress, weight: 1, height: 10 }
                                    - Button: { name: action, text: "详情", width: 64, height: 28 }
                          - Label: { text: "ScrollView + ListView", font_size: 13, preferred_height: 18 }
                          - ScrollView:
                              width: fill
                              height: 160
                              content:
                                ListView:
                                  selected: 0
                                  items:
                                    - "Item 01 — Gallery"
                                    - "Item 02 — Gallery"
                                    - "Item 03 — Gallery"
                                    - "Item 04 — Gallery"
                                    - "Item 05 — Gallery"
                                    - "Item 06 — Gallery"
                                    - "Item 07 — Gallery"
                                    - "Item 08 — Gallery"
                                    - "Item 09 — Gallery"
                                    - "Item 10 — Gallery"
                                    - "Item 11 — Gallery"
                                    - "Item 12 — Gallery"
                                    - "Item 13 — Gallery"
                                    - "Item 14 — Gallery"
                                    - "Item 15 — Gallery"
                          - Label: { text: "ListView（勾选）", font_size: 13, preferred_height: 18 }
                          - ScrollView:
                              width: fill
                              height: 140
                              content:
                                ListView:
                                  checkable: true
                                  selected: 0
                                  checked: [0, 2]
                                  items: ["可选 A", "可选 B", "可选 C", "可选 D"]
                - ScrollView:
                    width: fill
                    height: fill
                    content:
                      Column:
                        padding: 16
                        spacing: 10
                        children:
                          - Label: { text: "裁剪 / Tooltip / Dialog / Toast", font_size: 13, preferred_height: 18 }
                          - Label: { text: "对话框 Esc 关闭；Open Modeless 拖边缩放；Open NativeHost 嵌 HWND", font_size: 12, preferred_height: 20 }
                          - Row:
                              spacing: 12
                              children:
                                - Column:
                                    width: 140
                                    height: 48
                                    children:
                                      - Column:
                                          height: 80
                                          bg: "#c85050"
                                          children:
                                            - Label: { text: "clipped" }
                                - Column:
                                    width: 140
                                    height: 48
                                    clip: false
                                    children:
                                      - Column:
                                          height: 80
                                          bg: "#50a050"
                                          children:
                                            - Label: { text: "visible overflow" }
                          - Row:
                              spacing: 8
                              children:
                                - Button: { text: "Open Dialog", width: hug, height: 32, tooltip: "圆角无边框对话框" }
                                - Button: { text: "Open Square Dialog", width: hug, height: 32, tooltip: "直角无边框对话框" }
                                - Button: { text: "Open Modeless", width: hug, height: 32, tooltip: "非模态圆角窗：拖标题栏移动，双击最大化，拖边缩放" }
                                - Button: { text: "Open NativeHost", width: hug, height: 32, tooltip: "嵌 Win32 EDIT/STATIC：Owned 关窗销毁，Borrowed 保留" }
                          - Label: { text: "Toast 浮层（可连点排队）", font_size: 13, preferred_height: 18 }
                          - Row:
                              spacing: 8
                              children:
                                - Button: { text: "Toast Info", width: hug, height: 32, tooltip: "Info 浮层" }
                                - Button: { text: "Toast Success", width: hug, height: 32, tooltip: "Success 浮层" }
                                - Button: { text: "Toast Danger", width: hug, height: 32, tooltip: "Danger 浮层" }
                                - Button: { text: "Toast Sticky", width: hug, height: 32, tooltip: "duration<=0，点击关闭" }
                          - Label: { text: "页内 Toast（树内节点，非浮层）", font_size: 13, preferred_height: 18 }
                          - Toast: { text: "页内 Toast（非浮层）", variant: info, width: fill, height: 36 }
                          - Label: { text: "Popup 菜单样式（点按钮试开）", font_size: 13, preferred_height: 18 }
                          - Row:
                              spacing: 8
                              children:
                                - Button: { name: menu_style_classic, text: "经典扁平", width: hug, height: 32 }
                                - Button: { name: menu_style_buttons, text: "按钮风", width: hug, height: 32 }
                                - Button: { name: menu_style_dark, text: "深色", width: hug, height: 32 }
                          - Label: { text: "空白处右键 = 经典菜单（menu_classic.yaml）", font_size: 12, preferred_height: 20 }
                - ScrollView:
                    width: fill
                    height: fill
                    content:
                      Column:
                        padding: 16
                        spacing: 10
                        children:
                          - Label: { text: "从资源管理器拖文件到本窗口（任意页签都接收）", font_size: 13, preferred_height: 22 }
                          - Label: { text: "节点拖放（进程内，不是 OLE）", font_size: 13, preferred_height: 18 }
                          - Row:
                              spacing: 12
                              children:
                                - Label: { text: "拖我", font_size: 13, preferred_height: 22, draggable: true, drag_data: chip }
                                - Label: { text: "放到这里", font_size: 13, preferred_height: 22, drop_target: true }
    - Button: { text: "全局浮层", right: 12, v_align: center, width: hug, height: 72, bg: "#286EC880", bg_hover: "#3782D780", bg_pressed: "#1955A0A0", text_color: "#FFFFFF", tooltip: "全局浮层：靠右垂直居中，切页仍在；底 50% 透明" }

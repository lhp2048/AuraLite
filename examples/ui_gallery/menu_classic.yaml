# Classic context-menu look (default right-click in ui_gallery).
# Panel bg + flat left-aligned rows; Submenu row chrome matches Buttons.
# Note: layered popups ignore mouse on fully transparent pixels — item bg
# must be non-zero alpha (use panel-matching fill, not #00000000).
Column:
  bg: "#F5F7FAF2"
  width: 200
  padding: [4, 4, 4, 4]
  spacing: 0
  children:
    - Button:
        text: "Refresh status"
        width: fill
        height: 28
        corner_radius: 4
        text_align: left
        font_size: 13
        bg: "#F5F7FAF2"
        bg_hover: "#E6EEFA"
        bg_pressed: "#D7E4F7"
        on_click: refresh
    - Button:
        text: "About gallery"
        width: fill
        height: 28
        corner_radius: 4
        text_align: left
        font_size: 13
        bg: "#F5F7FAF2"
        bg_hover: "#E6EEFA"
        bg_pressed: "#D7E4F7"
        on_click: about
    - Submenu:
        text: "More"
        width: fill
        height: 28
        corner_radius: 4
        font_size: 13
        bg: "#F5F7FAF2"
        bg_hover: "#E6EEFA"
        content:
          Column:
            bg: "#F5F7FAF2"
            width: 200
            padding: 4
            spacing: 0
            children:
              - Button:
                  text: "Reset split ratio"
                  width: fill
                  height: 28
                  corner_radius: 4
                  text_align: left
                  font_size: 13
                  bg: "#F5F7FAF2"
                  bg_hover: "#E6EEFA"
                  bg_pressed: "#D7E4F7"
                  on_click: split_reset

window:
  title: Square Dialog
  width: 320
  height: 220
  kind: dialog
  caption: false
  corner_radius: 0
  border_width: 1
Column:
  width: fill
  height: fill
  children:
    - TitleBar:
        title: Square Dialog
        close: true
        minimize: false
        maximize: false
    - Column:
        padding: 20
        spacing: 12
        width: fill
        height: fill
        children:
          - Label: { text: "无圆角无边框对话框（corner_radius: 0）。拖标题栏移动。", font_size: 14 }
          - Button: { text: "关闭", variant: secondary, width: fill, height: 32, default: true, on_click: dialog_close }

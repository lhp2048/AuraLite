# Mix default MenuItem rows with a Button used as a custom menu row.
window:
  corner_radius: 8
  border_width: 1
Column:
  bg: "#F5F7FAF2"
  width: 220
  padding: [6, 4, 6, 4]
  spacing: 4
  children:
    - MenuItem: { text: "Refresh status", icon: list, font_size: 13, on_click: refresh }
    - MenuItem: { text: "About gallery", icon: file, font_size: 13, on_click: about }
    - MenuItem: { separator: true }
    - Button:
        text: "自定义按钮行"
        width: fill
        height: 32
        on_click: about
    - Submenu:
        text: "More"
        width: fill
        content:
          Column:
            bg: "#F5F7FAF2"
            padding: 4
            spacing: 4
            children:
              - MenuItem: { text: "Reset split ratio", icon: view, font_size: 13, on_click: split_reset }
              - Button: { text: "子菜单里的按钮", width: fill, height: 32, variant: secondary, on_click: split_reset }

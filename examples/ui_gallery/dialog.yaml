window:
  title: Dialog
  width: 320
  height: 220
  kind: dialog
  caption: false
  theme: dark
  corner_radius: 8
  border_width: 1
Column:
  width: fill
  height: fill
  children:
    - TitleBar:
        title: Dialog
        close: true
        minimize: false
        maximize: false
    - Column:
        padding: 20
        spacing: 12
        width: fill
        height: fill
        children:
          - Label: { text: "窗口主题 dark（主窗仍是进程 light）。拖标题栏移动。", font_size: 14 }
          - Button: { text: "关闭", variant: secondary, width: fill, height: 32, default: true, on_click: dialog_close }
